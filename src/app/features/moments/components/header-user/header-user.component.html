<ion-header class="header-user">
  <div class="header-user__info">
    <ion-text class="header-user__greeting">
      Olá, {{ username }}
    </ion-text>
    <ion-text class="header-user__welcome">
      Bem-vindo(a) ao Moments
    </ion-text>
  </div>

  <ion-avatar class="header-user__avatar">
    <img
      class="header-user__avatar-image"
      [src]="avatarImage"
    />
  </ion-avatar>
</ion-header>
