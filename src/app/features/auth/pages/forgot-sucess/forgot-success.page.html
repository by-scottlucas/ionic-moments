<ion-content [fullscreen]="true">
  <div class="forgot-success">
    <div class="forgot-success__icon-box">
      <lucide-icon
        [name]="icon"
        [size]="60"
      ></lucide-icon>
    </div>

    <ion-text class="forgot-success__title">
      Verifique seu e-mail
    </ion-text>

    <ion-text class="forgot-success__message text-black">
      Siga as instruções que foram enviadas para o seu e-mail
      para redefinir sua senha.
    </ion-text>

    <button
      type="button"
      (click)="goToLogin()"
      class="forgot-success__button"
    >
      Voltar ao Login
    </button>
  </div>
</ion-content>
